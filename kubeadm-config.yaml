apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  bindPort: ${PORT_KUBE_APISERVER}
nodeRegistration:
  # Since Kubernetes v1.37 (kubernetes/kubernetes#138250), the etcd port
  # preflight checks bind to the API server's advertise address
  # (`apiServer.extraArgs.advertise-address` below) rather than to the
  # wildcard address.
  # In Usernetes, the advertise address is `HOST_IP`, i.e., the address of the
  # physical host, which is deliberately not assigned to any interface inside
  # the node's network namespace. The bind therefore fails with
  # EADDRNOTAVAIL, which kubeadm reports as "Port 2379 is in use".
  #
  # The port numbers here are the kubeadm constants, not `PORT_ETCD`; kubeadm
  # always checks 2379 and 2380 regardless of the configured etcd port.
  ignorePreflightErrors:
  - Port-2379
  - Port-2380
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
controlPlaneEndpoint: "${NODE_NAME}:${PORT_KUBE_APISERVER}"
apiServer:
  certSANs:
  - localhost
  - 127.0.0.1
  - "${NODE_NAME}"
  - "${HOST_IP}"
  extraArgs:
  - name: etcd-servers
    value: https://127.0.0.1:${PORT_ETCD}
  - name: advertise-address
    value: ${HOST_IP}
  - name: secure-port
    value: "${PORT_KUBE_APISERVER}"
    # Default: "Hostname,InternalDNS,InternalIP,ExternalDNS,ExternalIP"    
  - name: kubelet-preferred-address-types
    value: ExternalIP
controllerManager:
  extraArgs:
    - name: cloud-provider
      value: external
networking:
  # The defaults (10.96.0.0/16 and 10.244.0.0/16) are set in ./Makefile;
  # the Kubernetes-in-Kubernetes mode (./kubernetes/Makefile) uses different
  # defaults so as not to overlap with the subnets of the outer cluster.
  serviceSubnet: "${SERVICE_SUBNET}"
  podSubnet: "${POD_SUBNET}"
etcd:
  local:
    extraArgs:
      - name: listen-client-urls
        value: "https://127.0.0.1:${PORT_ETCD},https://${NODE_IP}:${PORT_ETCD}"
      - name: advertise-client-urls
        value: https://${NODE_IP}:${PORT_ETCD}
---
kind: KubeletConfiguration
apiVersion: kubelet.config.k8s.io/v1beta1
failSwapOn: false
port: ${PORT_KUBELET}
featureGates:
  KubeletInUserNamespace: true
---
apiVersion: kubeproxy.config.k8s.io/v1alpha1
kind: KubeProxyConfiguration
mode: "iptables"
conntrack:
  # Skip setting sysctl value "net.netfilter.nf_conntrack_max"
  maxPerCore: 0
  # Skip setting "net.netfilter.nf_conntrack_tcp_timeout_established"
  tcpEstablishedTimeout: 0s
  # Skip setting "net.netfilter.nf_conntrack_tcp_timeout_close"
  tcpCloseWaitTimeout: 0s
